name: Build Windows x64 prebuild

on:
    workflow_dispatch:
        inputs:
            electronTarget:
                description: 'Electron version, e.g. 44.3.0'
                required: true
                type: string

jobs:
    build:
        runs-on: windows-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
            - uses: actions/setup-node@v4
              with:
                  node-version: '22.23.2'
                  cache: npm
            - run: npm ci
            - run: npm test
            - name: Build
              shell: powershell
              env:
                  ELECTRON_TARGET: ${{ inputs.electronTarget }}
              run: npm run build -- --electron-target=$env:ELECTRON_TARGET
            - name: Upload artifact
              uses: actions/upload-artifact@v4
              with:
                  name: gpu-metrics-electron-${{ inputs.electronTarget }}-win32-x64
                  path: dist/payload
                  if-no-files-found: error
                  retention-days: 90
